<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: radial-gradient(circle at top, #0a0a12 0%, #020203 60%, #000 100%);
            overflow: hidden;
            color: white;
        }

        /* glowing background */
        .blob {
            position: absolute;
            width: 350px;
            height: 380px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: float 10s infinite ease-in-out;
        }

        .blob1 {
            background: #00c6ff;
            top: 10%;
            left: 10%;
        }

        .blob2 {
            background: #7b2ff7;
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-50px); }
        }

        .container {
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-box {
            width: 550px;
            padding: 35px;
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        form p {
            margin: 12px 0;
        }

        /* Django form styling */
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 5px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.08);
            color: white;

            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border: 1px solid #00c6ff;
            box-shadow: 0 0 12px rgba(0,198,255,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 10px;
            cursor: pointer;

            background: linear-gradient(135deg, #00c6ff, #7b2ff7);
            color: white;
            font-weight: 600;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(0,198,255,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.8;
        }

        a {
            color: #00c6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* mobile */
        @media (max-width: 500px) {
            .glass-box {
                width: 90vw;
            }
        }
    </style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="container">
    <div class="glass-box">
        <h2>Create Account</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="/login/">Login</a>
        </div>
    </div>
</div>

</body>
</html>
